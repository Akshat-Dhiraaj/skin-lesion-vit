[project]
name = "skin-lesion-vit-v2"
version = "0.1.0"
description = "Cross-dataset and Fitzpatrick-stratified robustness of dermatology foundation models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "transformers>=4.45.0",
    "timm>=1.0.11",
    "huggingface_hub>=0.24.0",  # directly imported by RealPanDermClassifier (hf_hub_download)
    "albumentations>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "tqdm>=4.66.0",
    "Pillow>=10.4.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "mlflow>=2.16.0",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "pre-commit>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"